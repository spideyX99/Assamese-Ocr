<!DOCTYPE html>
<html lang="as">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Quality Assamese & English OCR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 20px; }
        #output { white-space: pre-line; border: 1px solid #ddd; padding: 10px; margin-top: 10px; text-align: left; max-width: 90%; margin-inline: auto; height: 200px; overflow-y: auto; }
        #progressContainer { width: 90%; max-width: 400px; background-color: #ddd; margin: auto; border-radius: 5px; overflow: hidden; }
        #progressBar { height: 20px; width: 0%; background-color: green; transition: width 0.2s; }
        #progressText { margin: 10px; font-weight: bold; }
        button { margin: 10px; padding: 10px; font-size: 16px; }
    </style>
</head>
<body>

    <h2>High-Quality Assamese & English OCR</h2>
    <p>Made with ❤️ by <a>Ronal</a></p>

    <input type="file" id="pdfInput" accept="application/pdf">
    <button onclick="processPDF()">Extract Text</button>
    <button onclick="downloadText()">Download Text</button>

    <h3 id="progressText">Waiting for input...</h3>
    <div id="progressContainer">
        <div id="progressBar"></div>
    </div>

    <h3>Extracted Text:</h3>
    <div id="output">Text will appear here...</div>

    <script>
        async function processPDF() {
            const file = document.getElementById("pdfInput").files[0];
            if (!file) {
                alert("Please select a PDF file.");
                return;
            }

            document.getElementById("progressText").innerText = "Processing PDF... Please wait.";
            document.getElementById("progressBar").style.width = "0%";

            const reader = new FileReader();
            reader.onload = async function(event) {
                const typedarray = new Uint8Array(event.target.result);

                try {
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    const totalPages = pdf.numPages;
                    let textOutput = "";
                    let startTime = Date.now();

                    const pagePromises = [];
                    
                    for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                        pagePromises.push(processPage(pdf, pageNum, totalPages, startTime));
                    }

                    const pageTexts = await Promise.all(pagePromises);
                    textOutput = pageTexts.join("\n");

                    document.getElementById("output").innerText = textOutput;
                    document.getElementById("progressText").innerText = "OCR Completed!";
                    document.getElementById("progressBar").style.width = "100%";
                } catch (err) {
                    document.getElementById("progressText").innerText = "Error processing PDF.";
                    console.error("Error:", err);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        async function processPage(pdf, pageNum, totalPages, startTime) {
            const page = await pdf.getPage(pageNum);
            const scale = 3; // High-quality image scaling
            const viewport = page.getViewport({ scale });

            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");
            canvas.width = viewport.width;
            canvas.height = viewport.height;

            await page.render({ canvasContext: context, viewport }).promise;

            preprocessImage(canvas);

            const { data: { text } } = await Tesseract.recognize(
                canvas,
                'asm+eng', // Assamese and English OCR
                {
                    langPath: 'https://tessdata.projectnaptha.com/4.0.0',
                    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789অআইঈউঊঋএঐওঔকখগঘঙচছজঝঞটঠডঢণতথদধনপফবভমযরলশষসহঅংঃঁ'
                }
            );

            updateProgress(pageNum, totalPages, startTime);
            return `\n--- Page ${pageNum} ---\n${text}`;
        }

        function preprocessImage(canvas) {
            const context = canvas.getContext("2d");
            const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                const gray = data[i] * 0.3 + data[i + 1] * 0.59 + data[i + 2] * 0.11;
                const contrast = 1.5;
                const newGray = ((gray - 128) * contrast) + 128;
                const finalGray = Math.max(0, Math.min(255, newGray));
                data[i] = data[i + 1] = data[i + 2] = finalGray;
            }

            context.putImageData(imageData, 0, 0);
        }

        function updateProgress(currentPage, totalPages, startTime) {
            const progress = (currentPage / totalPages) * 100;
            document.getElementById("progressBar").style.width = progress + "%";

            const elapsedTime = (Date.now() - startTime) / 1000;
            const estimatedTotalTime = (elapsedTime / currentPage) * totalPages;
            const remainingTime = Math.max(0, estimatedTotalTime - elapsedTime).toFixed(1);

            document.getElementById("progressText").innerText = `Processing: Page ${currentPage}/${totalPages} - Estimated Time Left: ${remainingTime}s`;
        }

        function downloadText() {
            const text = document.getElementById("output").innerText;
            if (!text.trim()) {
                alert("No text to download!");
                return;
            }
            const blob = new Blob([text], { type: "text/plain" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "extracted_text.txt";
            link.click();
        }
    </script>

</body>
</html>
